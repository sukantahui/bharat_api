<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="processGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="processGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="processGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="processGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="processGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>

    <!-- Filter for soft shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="24" width="1220" height="70" rx="12" fill="#1e293b" filter="url(#shadow)" stroke="#334155" stroke-width="1"/>
  <text x="70" y="58" font-size="22" font-weight="bold" fill="url(#headerGrad)">CNAT API — System Architecture &amp; Data Flow Diagram (DFD)</text>
  <text x="70" y="78" font-size="12" fill="#94a3b8">Laravel 11 REST API  •  Sanctum Auth  •  Multi-Tenant Academic ERP &amp; Micro-Services  •  MySQL 8.x</text>

  <!-- ==================== LEFT COLUMN: EXTERNAL ENTITIES (ACTORS) ==================== -->
  <text x="50" y="130" font-size="14" font-weight="bold" fill="#64748b" letter-spacing="1">EXTERNAL ENTITIES (CLIENTS / ACTORS)</text>

  <!-- Entity 1: Staff / Admin -->
  <g filter="url(#shadow)">
    <rect x="50" y="150" width="180" height="90" rx="10" fill="url(#actorGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="65" y="165" width="28" height="28" rx="6" fill="#38bdf8" opacity="0.2"/>
    <text x="79" y="184" font-size="16" text-anchor="middle" fill="#38bdf8">👤</text>
    <text x="105" y="180" font-size="14" font-weight="bold" fill="#f8fafc">Staff / Admin</text>
    <text x="65" y="212" font-size="11" fill="#94a3b8">Academic ERP &amp; Exam Ops</text>
    <text x="65" y="226" font-size="10" fill="#64748b">Bearer Token Auth</text>
  </g>

  <!-- Entity 2: Student / Candidate -->
  <g filter="url(#shadow)">
    <rect x="50" y="270" width="180" height="90" rx="10" fill="url(#actorGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="65" y="285" width="28" height="28" rx="6" fill="#818cf8" opacity="0.2"/>
    <text x="79" y="304" font-size="16" text-anchor="middle" fill="#818cf8">🎓</text>
    <text x="105" y="300" font-size="14" font-weight="bold" fill="#f8fafc">Student / Applicant</text>
    <text x="65" y="332" font-size="11" fill="#94a3b8">Admissions, Courses &amp; Certs</text>
    <text x="65" y="346" font-size="10" fill="#64748b">Voucher Generated ID</text>
  </g>

  <!-- Entity 3: Public Website Visitor -->
  <g filter="url(#shadow)">
    <rect x="50" y="390" width="180" height="90" rx="10" fill="url(#actorGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="65" y="405" width="28" height="28" rx="6" fill="#34d399" opacity="0.2"/>
    <text x="79" y="424" font-size="16" text-anchor="middle" fill="#34d399">🌐</text>
    <text x="105" y="420" font-size="14" font-weight="bold" fill="#f8fafc">Public Visitor</text>
    <text x="65" y="452" font-size="11" fill="#94a3b8">Inquiries &amp; Lead Capture</text>
    <text x="65" y="466" font-size="10" fill="#64748b">Honeypot + Bot Shield</text>
  </g>

  <!-- Entity 4: Event Guest -->
  <g filter="url(#shadow)">
    <rect x="50" y="510" width="180" height="90" rx="10" fill="url(#actorGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="65" y="525" width="28" height="28" rx="6" fill="#fbbf24" opacity="0.2"/>
    <text x="79" y="544" font-size="16" text-anchor="middle" fill="#fbbf24">🎟️</text>
    <text x="105" y="540" font-size="14" font-weight="bold" fill="#f8fafc">Event Guest</text>
    <text x="65" y="572" font-size="11" fill="#94a3b8">RSVP, Dietary &amp; Tokens</text>
    <text x="65" y="586" font-size="10" fill="#64748b">Masked Mobile Security</text>
  </g>

  <!-- Entity 5: Health / Cycle User -->
  <g filter="url(#shadow)">
    <rect x="50" y="630" width="180" height="90" rx="10" fill="url(#actorGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="65" y="645" width="28" height="28" rx="6" fill="#f472b6" opacity="0.2"/>
    <text x="79" y="664" font-size="16" text-anchor="middle" fill="#f472b6">🌸</text>
    <text x="105" y="660" font-size="14" font-weight="bold" fill="#f8fafc">Cycle App Client</text>
    <text x="65" y="692" font-size="11" fill="#94a3b8">Menstrual Tracker &amp; Forecast</text>
    <text x="65" y="706" font-size="10" fill="#64748b">Sanctum Token Identified</text>
  </g>

  <!-- ==================== CENTER COLUMN: CORE API SUBSYSTEMS (PROCESSES) ==================== -->
  <text x="340" y="130" font-size="14" font-weight="bold" fill="#64748b" letter-spacing="1">CORE PROCESSES &amp; BUSINESS LOGIC (CONTROLLERS &amp; SERVICES)</text>

  <!-- Process 1: Auth & User Identity -->
  <g filter="url(#shadow)">
    <rect x="340" y="150" width="360" height="90" rx="10" fill="url(#processGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="360" y="178" font-size="14" font-weight="bold" fill="#ffffff">1.0 Authentication &amp; Identity Subsystem</text>
    <text x="360" y="200" font-size="11" fill="#bae6fd">AuthController • Sanctum Token Engine • Revoke / Refresh</text>
    <text x="360" y="222" font-size="10" fill="#e0f2fe">Endpoints: POST /login, POST /register, GET /me, POST /logout</text>
  </g>

  <!-- Process 2: Student & Admission Engine -->
  <g filter="url(#shadow)">
    <rect x="340" y="260" width="360" height="105" rx="10" fill="url(#processGrad2)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="360" y="286" font-size="14" font-weight="bold" fill="#ffffff">2.0 Student &amp; Admission Management</text>
    <text x="360" y="306" font-size="11" fill="#c7d2fe">StudentController • AdmissionController • FeeReceiptController</text>
    <text x="360" y="324" font-size="10" fill="#e0e7ff">Auto-Voucher Generator (CNAT-00001-2425) • DB Lock &amp; Transactions</text>
    <text x="360" y="342" font-size="10" fill="#c7d2fe">Endpoints: /students, /admissions/admissionWithStudent, /fees-receipts</text>
  </g>

  <!-- Process 3: Academic Curriculum & Exam Engine -->
  <g filter="url(#shadow)">
    <rect x="340" y="385" width="360" height="105" rx="10" fill="url(#processGrad3)" stroke="#34d399" stroke-width="1.5"/>
    <text x="360" y="411" font-size="14" font-weight="bold" fill="#ffffff">3.0 Academic Hierarchy &amp; Examination Engine</text>
    <text x="360" y="431" font-size="11" fill="#a7f3d0">Courses • Subjects • Chapters • Topics • Question Bank &amp; Options</text>
    <text x="360" y="449" font-size="10" fill="#d1fae5">Evaluation Engine • Results Processing • Certificate Verification</text>
    <text x="360" y="467" font-size="10" fill="#a7f3d0">Endpoints: /courses, /subjects, /topics, /questions, /certificates</text>
  </g>

  <!-- Process 4: Guest RSVP & Event Token Engine -->
  <g filter="url(#shadow)">
    <rect x="340" y="510" width="360" height="95" rx="10" fill="url(#processGrad4)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="360" y="536" font-size="14" font-weight="bold" fill="#ffffff">4.0 Event RSVP &amp; Guest Management Engine</text>
    <text x="360" y="556" font-size="11" fill="#fde68a">GuestController • Auto Token Prefix (CNAT-1001+) • Attendance</text>
    <text x="360" y="574" font-size="10" fill="#fef3c7">Food Preferences • Mobile Masking (XX...XX) • Multi-Field Search</text>
    <text x="360" y="592" font-size="10" fill="#fde68a">Endpoints: /guests/pagination, /guests/search/any</text>
  </g>

  <!-- Process 5: Public Inquiries & Bot Defense -->
  <g filter="url(#shadow)">
    <rect x="340" y="625" width="360" height="85" rx="10" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="360" y="650" font-size="14" font-weight="bold" fill="#34d399">5.0 Public Inquiries &amp; Bot Defense Shield</text>
    <text x="360" y="670" font-size="11" fill="#94a3b8">VisitorController • Honeypot Check • IP &amp; Device Detection</text>
    <text x="360" y="688" font-size="10" fill="#64748b">Rate Limiting (throttle:3,1) • Audit Logging • Auto Lead Store</text>
  </g>

  <!-- Process 6: Menstrual Cycle Calendar Micro-service -->
  <g filter="url(#shadow)">
    <rect x="340" y="730" width="360" height="100" rx="10" fill="url(#processGrad5)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="360" y="756" font-size="14" font-weight="bold" fill="#ffffff">6.0 Menstrual Cycle Calendar Tracking Engine</text>
    <text x="360" y="776" font-size="11" fill="#fbcfe8">CycleCalendarController • Dynamic Profile Auto-Creation (firstOrCreate)</text>
    <text x="360" y="794" font-size="10" fill="#fce7f3">Batch Period Sync • Fertile Window Calculations • Camel-Snake Conversion</text>
    <text x="360" y="812" font-size="10" fill="#fbcfe8">Endpoints: GET /cycle/me, POST /cycle/period, POST /cycle/periods/sync</text>
  </g>

  <!-- ==================== RIGHT COLUMN: DATA STORES (DATABASE TABLES) ==================== -->
  <text x="830" y="130" font-size="14" font-weight="bold" fill="#64748b" letter-spacing="1">DATA STORES (MYSQL 8.X / ELOQUENT)</text>

  <!-- Store D1: Users & Identity -->
  <g filter="url(#shadow)">
    <rect x="830" y="150" width="410" height="70" rx="8" fill="url(#storeGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="830" y="150" width="45" height="70" rx="8" fill="#4338ca"/>
    <text x="852" y="190" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D1</text>
    <text x="890" y="175" font-size="13" font-weight="bold" fill="#e0e7ff">Identity &amp; Tokens</text>
    <text x="890" y="195" font-size="10" fill="#a5b4fc">users, personal_access_tokens, user_types, designations, employees, departments</text>
  </g>

  <!-- Store D2: Students & Admissions -->
  <g filter="url(#shadow)">
    <rect x="830" y="240" width="410" height="85" rx="8" fill="url(#storeGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="830" y="240" width="45" height="85" rx="8" fill="#4338ca"/>
    <text x="852" y="285" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D2</text>
    <text x="890" y="263" font-size="13" font-weight="bold" fill="#e0e7ff">Students, Admissions &amp; Receipts</text>
    <text x="890" y="283" font-size="10" fill="#a5b4fc">students, admissions, custom_vouchers, course_statuses, fee_modes,</text>
    <text x="890" y="298" font-size="10" fill="#a5b4fc">simple_fees_receipts, states, districts</text>
  </g>

  <!-- Store D3: Curriculum & Exam -->
  <g filter="url(#shadow)">
    <rect x="830" y="345" width="410" height="85" rx="8" fill="url(#storeGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="830" y="345" width="45" height="85" rx="8" fill="#4338ca"/>
    <text x="852" y="390" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D3</text>
    <text x="890" y="368" font-size="13" font-weight="bold" fill="#e0e7ff">Curriculum, Question Bank &amp; Certs</text>
    <text x="890" y="388" font-size="10" fill="#a5b4fc">courses, course_details, subjects, chapters, topics, questions, options,</text>
    <text x="890" y="403" font-size="10" fill="#a5b4fc">question_types, question_levels, results, certificates</text>
  </g>

  <!-- Store D4: Guests -->
  <g filter="url(#shadow)">
    <rect x="830" y="450" width="410" height="70" rx="8" fill="url(#storeGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="830" y="450" width="45" height="70" rx="8" fill="#4338ca"/>
    <text x="852" y="490" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D4</text>
    <text x="890" y="475" font-size="13" font-weight="bold" fill="#e0e7ff">Guest Event RSVPs</text>
    <text x="890" y="495" font-size="10" fill="#a5b4fc">guests, genders, food_preferences</text>
  </g>

  <!-- Store D5: Visitors & Logs -->
  <g filter="url(#shadow)">
    <rect x="830" y="540" width="410" height="70" rx="8" fill="url(#storeGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="830" y="540" width="45" height="70" rx="8" fill="#4338ca"/>
    <text x="852" y="580" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D5</text>
    <text x="890" y="565" font-size="13" font-weight="bold" fill="#e0e7ff">Inquiries &amp; Bot Defense Logs</text>
    <text x="890" y="585" font-size="10" fill="#a5b4fc">visitors, bot_logs</text>
  </g>

  <!-- Store D6: Cycle Health -->
  <g filter="url(#shadow)">
    <rect x="830" y="630" width="410" height="70" rx="8" fill="url(#storeGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="830" y="630" width="45" height="70" rx="8" fill="#4338ca"/>
    <text x="852" y="670" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D6</text>
    <text x="890" y="655" font-size="13" font-weight="bold" fill="#e0e7ff">Cycle Health Profiles &amp; Entries</text>
    <text x="890" y="675" font-size="10" fill="#a5b4fc">cycle_users, cycle_period_entries (Unique per user/date)</text>
  </g>

  <!-- ==================== FLOW CONNECTIONS (ARROWS) ==================== -->
  <!-- Actor 1 -> Process 1 -->
  <path d="M 230 190 L 330 190" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Process 1 -> Store D1 -->
  <path d="M 700 185 L 820 185" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Actor 2 -> Process 2 -->
  <path d="M 230 310 L 330 310" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Process 2 -> Store D2 -->
  <path d="M 700 290 L 820 290" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process 2 -> Process 3 (Admission to Course) -->
  <path d="M 700 410 L 820 410" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Actor 4 -> Process 4 -->
  <path d="M 230 555 L 330 555" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <!-- Process 4 -> Store D4 -->
  <path d="M 700 555 L 820 490" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- Actor 3 -> Process 5 -->
  <path d="M 230 435 L 310 435 L 310 650 L 330 650" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <!-- Process 5 -> Store D5 -->
  <path d="M 700 665 L 820 580" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Actor 5 -> Process 6 -->
  <path d="M 230 675 L 310 675 L 310 770 L 330 770" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <!-- Process 6 -> Store D6 -->
  <path d="M 700 770 L 780 770 L 780 670 L 820 670" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrowPink)"/>

  <!-- Footer / Legend -->
  <rect x="40" y="850" width="1220" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="872" font-size="11" fill="#94a3b8">LEGEND: </text>
  <rect x="120" y="862" width="12" height="12" rx="2" fill="#334155" stroke="#475569"/>
  <text x="140" y="872" font-size="11" fill="#cbd5e1">External Entity</text>

  <rect x="250" y="862" width="12" height="12" rx="2" fill="#0284c7"/>
  <text x="270" y="872" font-size="11" fill="#cbd5e1">Core API Process</text>

  <rect x="400" y="862" width="12" height="12" rx="2" fill="#4338ca"/>
  <text x="420" y="872" font-size="11" fill="#cbd5e1">Database Entity (Store)</text>

  <line x1="580" y1="868" x2="610" y2="868" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="872" font-size="11" fill="#cbd5e1">Authenticated Data Flow</text>

  <line x1="780" y1="868" x2="810" y2="868" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="820" y="872" font-size="11" fill="#cbd5e1">Public / Shielded Flow</text>

  <text x="1050" y="872" font-size="11" fill="#64748b">Generated for CNAT API Architecture</text>
</svg>
